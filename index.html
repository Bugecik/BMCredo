<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMCredo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- EKRAN LOGOWANIA / REJESTRACJI -->
    <div id="auth-overlay" class="auth-container">
        <div class="auth-box">
            <h2>BMCredo</h2>
            <p>Zaloguj się, aby uzyskać dostęp do aplikacji.</p>
            
            <div id="auth-error" class="error-msg"></div>

            <form id="auth-form">
                <div class="input-group">
                    <label for="username">Nazwa użytkownika</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Hasło</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                
                <div class="auth-buttons">
                    <button type="submit" id="btn-login" class="btn primary">Zaloguj się</button>
                    <button type="button" id="btn-register" class="btn secondary">Zarejestruj się</button>
                </div>
            </form>
        </div>
    </div>

    <!-- WŁAŚCIWA APLIKACJA -->
    <div id="app-container" style="display: none;">
        <header>
            <h1>BMCredo</h1>
            <div class="user-info">
                Zalogowany jako: <span id="current-user-display"></span>
                <button id="btn-logout" class="btn logout">Wyloguj</button>
            </div>
        </header>

        <main class="kasa-layout">
            <section class="panel-produkty">
                <h2>Skaner / Produkty</h2>
                <div id="reader" style="width: 100%; max-width: 400px; margin-bottom: 20px;"></div>
                <button id="btn-start-scanner" class="btn primary">Włącz Skaner Kamery</button>
            </section>

            <section class="panel-koszyk">
                <h2>Twoje Dane</h2>
                <div class="koszyk-lista" id="cart-items">
                    <p class="puste">Brak pozycji.</p>
                </div>
                <div class="koszyk-podsumowanie">
                    <button id="btn-add-sample" class="btn secondary">Dodaj testowy wpis</button>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
